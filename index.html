<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070606">
<title>以为 · 网页解密小游戏 | dy@雪霁</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#070606; --ink2:#0e0b09; --paper:#e6d8bd; --paper2:#c9b593;
  --red:#b23a3a; --red2:#c2424b; --gold:#e8b25c; --dim:#8a7860;
  --line:#2a211a;
}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;overflow:hidden;
  -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink);
  transition:filter .9s ease}
#app.filtered{filter:saturate(1.35) sepia(.28) hue-rotate(-14deg) contrast(1.08)}

/* ---------- 顶栏 ---------- */
#topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid #1d1712;background:linear-gradient(#0e0b09,#080606);
  position:relative;z-index:6}
.chapter{font-size:14px;letter-spacing:.26em;color:#b9a685}
.chapter b{color:var(--red2);font-weight:400}
.tb-left{display:flex;flex-direction:column;gap:3px;min-width:0}
#goal{font-size:10px;letter-spacing:.06em;color:#6f6151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
#tip{position:fixed;z-index:95;pointer-events:none;background:rgba(10,8,6,.92);border:1px solid #4a3a29;
  color:#dccdb2;font-size:11.5px;padding:3px 8px;border-radius:2px;letter-spacing:.08em;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
.tb-right{display:flex;align-items:center;gap:6px}
#strikes{display:flex;align-items:center;gap:6px;margin-right:8px}
#strikes span{width:7px;height:7px;border-radius:50%;background:#332a22;transition:.4s}
#strikes span.on{background:var(--red2);box-shadow:0 0 10px rgba(194,66,75,.8)}
.iconbtn{width:38px;height:38px;border:1px solid #2e251d;background:transparent;color:#a08d72;
  border-radius:2px;font-size:15px;font-family:inherit;cursor:pointer;transition:.25s;line-height:1}
.iconbtn:hover{color:var(--paper);border-color:#5a4733;background:#14100c}
.iconbtn.off{opacity:.35}

/* ---------- 舞台 ---------- */
#stage.after-box svg.scene{filter:brightness(.7) saturate(.8);transition:filter 1.4s ease}
#stage.after-box #vignette{background:radial-gradient(ellipse at 50% 45%,rgba(130,85,45,.12) 10%,rgba(0,0,0,.78) 82%)}
#stage.after-yard svg.scene{filter:brightness(1.18) saturate(.7) hue-rotate(-10deg);transition:filter 1.4s ease}
#stage.after-cell svg.scene{filter:brightness(1.15) saturate(.8);transition:filter 1.4s ease}#stage{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 42%,#15100c 0%,#0a0807 55%,#050404 100%);overflow:hidden}
#sceneWrap{position:absolute;inset:0}
svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block;filter:brightness(1.12)}
#rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background-image:repeating-linear-gradient(104deg,transparent 0 7px,rgba(190,210,235,.055) 7px 8px);
  animation:rainfall .7s linear infinite;mix-blend-mode:screen}
@keyframes rainfall{from{background-position:0 0}to{background-position:-80px 240px}}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;transition:background 1.3s ease}
body[data-scene="gate"] #stage::after{background:radial-gradient(ellipse at 50% 26%,rgba(110,140,175,.13),rgba(0,0,0,.46) 78%)}
body[data-scene="room"] #stage::after{background:radial-gradient(ellipse at 38% 30%,rgba(232,178,92,.15),rgba(0,0,0,.5) 72%)}
body[data-scene="pit"] #stage::after{background:radial-gradient(ellipse at 50% 18%,rgba(210,180,120,.11),rgba(0,0,0,.58) 75%)}
body[data-scene="box3"] #stage::after{background:radial-gradient(ellipse at 50% 38%,rgba(236,160,78,.17),rgba(0,0,0,.55) 70%)}
body[data-scene="yard"] #stage::after{background:radial-gradient(ellipse at 72% 12%,rgba(170,190,212,.15),rgba(0,0,0,.6) 70%)}
body[data-scene="cell"] #stage::after{background:radial-gradient(ellipse at 14% 18%,rgba(160,175,190,.17),rgba(0,0,0,.6) 72%)}#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%)}
#sub{position:absolute;left:0;right:0;bottom:10px;padding:0 16px;text-align:center;
  pointer-events:none;z-index:4;min-height:1px}
#sub.wait p::after{content:" ▾";color:#8a7860;animation:breathe 1.8s ease-in-out infinite}
#sub p{display:inline-block;margin:0;padding:9px 20px;max-width:min(720px,92vw);
  font-size:15px;line-height:1.95;letter-spacing:.05em;color:#e8dcc4;
  background:rgba(7,6,5,.74);border-top:1px solid rgba(200,170,120,.16);
  border-bottom:1px solid rgba(200,170,120,.10);border-radius:2px;
  text-shadow:0 1px 0 #000;animation:subin .35s ease}
@keyframes subin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 底部物品栏 ---------- */
#bar{flex:0 0 auto;height:86px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-top:1px solid #1d1712;background:linear-gradient(#0a0807,#060505);position:relative;z-index:6}
#inv{flex:1 1 auto;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 0;
  scrollbar-width:none}
#inv::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:58px;height:60px;border:1px dashed #322820;border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;color:#6f6151;transition:.25s;cursor:default}
.slot .ic{font-size:17px;opacity:.5;line-height:1}
.slot.has{border-style:solid;border-color:#5d4a33;background:#14100c;color:#d6c6a8;cursor:pointer}
.slot.has .ic{opacity:1;color:var(--gold)}
.slot.has:active{transform:translateY(1px)}
.slot.empty{opacity:.45}
#btnSkip{flex:0 0 auto;height:44px;padding:0 14px;border:1px dashed #6b563a;background:#0f0c09;
  color:#a08d72;font-family:inherit;font-size:12px;letter-spacing:.1em;border-radius:2px;cursor:pointer}
#btnSkip:active{background:#1a1410}#btnHint{flex:0 0 auto;height:44px;padding:0 16px;border:1px solid #4a3a29;background:#100c09;
  color:#c9b593;font-family:inherit;font-size:13px;letter-spacing:.16em;border-radius:2px;cursor:pointer}
#btnHint:active{background:#1a1410}

/* ---------- 热点 ---------- */
.hot{cursor:pointer;pointer-events:all;transition:filter .18s}
.hot .hit{fill:transparent;stroke:none}
.hot .glint{opacity:.5;transition:opacity .3s}
.hot:hover{filter:brightness(1.22)}
.hot:active{filter:brightness(1.4)}
.hot:hover .glint,.hot:focus .glint{opacity:1}
.hot .glint circle{fill:#ffe3ab;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.9}}
.hot.done .glint{display:none}
.hot.done{opacity:.82}
.hot.ping .glint{opacity:1}
.hot.ping .glint circle{fill:var(--red2);animation:ping .9s ease-out 3}
@keyframes ping{0%{r:3;opacity:1}100%{r:16;opacity:0}}
.hot:focus{outline:none}

/* ---------- 弹窗 ---------- */
#action{position:fixed;left:50%;bottom:158px;transform:translateX(-50%);z-index:88;
  border-color:#8c3a3a;background:rgba(140,50,50,.22);color:#f0d9c8;
  box-shadow:0 8px 30px rgba(0,0,0,.6);animation:apulse 1.8s ease-in-out infinite}
@keyframes apulse{0%,100%{box-shadow:0 8px 30px rgba(0,0,0,.6)}50%{box-shadow:0 8px 30px rgba(160,60,60,.55)}}#modal{position:fixed;inset:0;z-index:90;display:none;padding:14px;
  background:rgba(4,3,3,.8);backdrop-filter:blur(3px)}
#modal.on{display:flex;align-items:center;justify-content:center}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-width:760px;min-width:0;max-height:calc(100dvh - 28px);overflow:auto;
  background:linear-gradient(160deg,#14110e,#0b0908);border:1px solid #3a2f24;
  border-radius:3px;box-shadow:0 30px 90px rgba(0,0,0,.9);padding:22px 22px 20px;
  animation:panelin .3s cubic-bezier(.2,.9,.3,1)}
@keyframes panelin{from{transform:translateY(12px) scale(.985)}to{transform:none}}
.panel h3{margin:0 0 4px;font-size:19px;letter-spacing:.22em;color:#e2d2b4;font-weight:400}
.panel h3::before{content:"";display:inline-block;width:5px;height:16px;background:var(--red2);
  margin-right:10px;vertical-align:-2px}
.panel .muted{color:#8d7d68;font-size:13px;line-height:1.9;margin:6px 0 16px;letter-spacing:.03em}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{min-height:44px;padding:10px 20px;border:1px solid #5d4a33;background:transparent;
  color:#d9c9a8;font-family:inherit;font-size:14px;letter-spacing:.14em;border-radius:2px;
  cursor:pointer;transition:.22s}
.btn:hover{background:#1b1510;border-color:#8a6a45}
.btn.primary{border-color:#8c3a3a;background:rgba(140,50,50,.14);color:#e8c9b8}
.btn.primary:hover{background:rgba(160,55,55,.24)}
.btn.ghost{border-color:#332a22;color:#8d7d68}
.btn:disabled{opacity:.35;cursor:not-allowed}
.x{position:absolute;top:10px;right:12px}

/* 纸 */
.paper{background:linear-gradient(#e9dcc1,#ded0b1);color:#241c15;padding:20px 22px;
  line-height:2.05;font-size:14.5px;letter-spacing:.04em;
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
  box-shadow:inset 0 0 60px rgba(120,90,50,.18),0 6px 20px rgba(0,0,0,.4);
  border-radius:1px;position:relative}
.paper::after{content:"";position:absolute;inset:6px;border:1px solid rgba(90,60,30,.22);pointer-events:none}
.paper .addr{font-size:13px;color:#6b5334;letter-spacing:.1em;margin-bottom:8px}
.paper .seal{position:absolute;right:18px;bottom:16px;width:44px;height:44px;border:2px solid #9c3b32;
  color:#9c3b32;border-radius:3px;display:grid;place-items:center;font-size:11px;line-height:1.1;
  text-align:center;transform:rotate(-7deg);opacity:.85;font-family:"STKaiti",serif;padding:3px}

/* 键盘 */
.kdisp{font-family:ui-monospace,Menlo,monospace;font-size:30px;letter-spacing:.4em;
  text-align:center;padding:16px 0 18px;color:var(--gold);text-shadow:0 0 18px rgba(232,178,92,.35)}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.k{height:52px;border:1px solid #43362a;background:#13100c;color:#dccdb2;font-size:18px;
  font-family:inherit;border-radius:2px;cursor:pointer;transition:.15s}
.k:hover{background:#1d1710;border-color:#6b563a}
.k:active{transform:scale(.97);background:#2a2118}
.k.fn{font-size:14px;letter-spacing:.1em;color:#a08d72}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* 卡片列表 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.card{border:1px solid #332a22;background:#100d0a;padding:11px 12px;border-radius:2px;
  cursor:pointer;transition:.18s;min-height:74px;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:#5d4a33;background:#161210}
.card.sel{border-color:var(--red2);background:rgba(120,40,40,.16);box-shadow:inset 0 0 0 1px rgba(194,66,75,.3)}
.card .nm{font-size:14px;color:#dccdb2;letter-spacing:.1em}
.card .ds{font-size:11.5px;color:#7d6f5d;line-height:1.6}
.card.sel .nm{color:#f0d9c8}
.card.bad{border-color:#c2424b;background:rgba(160,45,48,.24);animation:shake .42s}
.card.bad .nm{color:#ffd6c8}

/* 镜子 */
.mirror-box{position:relative;height:190px;margin:6px 0 4px;border:1px solid #2a221a;
  background:linear-gradient(#0b0908,#14100c);border-radius:2px;overflow:hidden}
.mwall{position:absolute;inset:0;display:grid;place-items:center}
#ghost{font-size:clamp(20px,5vw,32px);letter-spacing:.4em;color:#ffdca6;
  text-shadow:0 0 24px rgba(255,200,120,.9);opacity:0;transition:opacity .18s;font-family:"STKaiti",serif}
.mlamp{position:absolute;bottom:14px;width:22px;height:30px;border-radius:4px 4px 2px 2px;
  background:radial-gradient(circle at 50% 30%,#ffe6b0,#d99b3f 60%,#8a5c1d);box-shadow:0 0 40px 14px rgba(232,178,92,.35);
  transform:translateX(-50%);transition:left .08s linear}
.slab{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:12px;color:#8d7d68;letter-spacing:.1em}
input[type=range]{flex:1;appearance:none;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3a2f24}
input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;margin-top:-10px;
  border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe6b0,#c98f3a);box-shadow:0 0 14px rgba(232,178,92,.6)}
input[type=range]::-moz-range-track{height:2px;background:#3a2f24}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#e8b25c}

/* 梅花 */
.plum-wrap{display:grid;place-items:center;padding:8px 0 4px;position:relative}
#petals{transition:transform .45s cubic-bezier(.2,.9,.3,1);cursor:pointer;transform-origin:150px 150px}
.petal{fill:#2a211a;stroke:#6b563a;stroke-width:1.5;transition:fill .4s}
.petal.lit{fill:#8c3a3a;stroke:#c2424b}
.plum-count{font-size:12px;color:#8d7d68;letter-spacing:.2em;text-align:center;margin-top:6px}

/* 鞋印 */
.foot-box{background:#15110d;border:1px solid #2a221a;padding:14px;display:grid;
  grid-template-columns:1fr 1fr;gap:14px;justify-items:center}
.foot{opacity:.75}
.footcap{font-size:11px;color:#7d6f5d;text-align:center;margin-top:4px;letter-spacing:.1em}

/* 结局 / 开头 */
#intro{position:fixed;inset:0;z-index:80;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 40%,#171210 0%,#080707 60%,#030303 100%);
  transition:opacity .8s,visibility .8s}
#intro.bye{opacity:0;visibility:hidden}
.intro-in{text-align:center;padding:24px;max-width:520px}
.intro-in .t1{font-size:clamp(38px,10vw,64px);letter-spacing:.34em;color:#e8dcc4;
  text-indent:.34em;margin:0 0 6px;text-shadow:0 2px 30px rgba(232,178,92,.18)}
.intro-in .t2{font-size:12px;letter-spacing:.5em;color:#8d7d68;text-indent:.5em;margin:0 0 6px}
.intro-in .src{font-size:11.5px;letter-spacing:.14em;color:#9d8a6e;margin:0 0 14px;opacity:.92}
.intro-in .role{font-size:12.5px;letter-spacing:.06em;color:#c0ad8e;margin:0 0 14px;line-height:1.9}
.cast{display:flex;flex-direction:column;gap:10px;margin:8px 0 0}
.cast .p{display:flex;gap:14px;border-bottom:1px solid #241c16;padding-bottom:10px}
.cast .nm2{flex:0 0 4.4em;color:#e2d2b4;letter-spacing:.12em;font-size:14px}
.cast .ds2{flex:1;color:#9c8a72;font-size:12.5px;line-height:1.95}
.cast2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 0}
.pcard{border:1px solid #6b563a;background:#e6d8bd;border-radius:2px;overflow:hidden;text-align:center;box-shadow:inset 0 0 26px rgba(120,90,50,.18)}
.pcard img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;mix-blend-mode:multiply;background:#e6d8bd}
.pcard .pn{padding:6px 2px 2px;font-size:12.5px;letter-spacing:.14em;color:#3a2a1c;font-family:"STKaiti","KaiTi",serif}
.pcard .pd{font-size:9.5px;color:#6b5334;padding:2px 5px 9px;line-height:1.5}
@media (max-width:560px){
  #bar{padding-bottom:calc(4px + env(safe-area-inset-bottom));height:auto;min-height:80px}
  .panel{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  #topbar{padding-top:env(safe-area-inset-top)}
}
@media (max-height:700px){
  #topbar{height:44px}
  #bar{min-height:64px;height:64px}
  .slot{width:46px;height:48px;font-size:9px}
  #sub p{font-size:14px;line-height:1.85}
  #btnHint,#btnSkip{height:40px;font-size:12px}
  .panel{padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  .panel h3{font-size:18px;margin-bottom:2px}
  .anotes img{width:60px}
  .noteone img{width:150px}
}
@media (max-width:560px){
  #goal{display:none}
  #ver{display:none}
  #topbar{padding:0 8px}
}
@media (max-width:560px){
  #bar{padding-bottom:calc(4px + env(safe-area-inset-bottom));height:auto;min-height:80px}
  .panel{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  #topbar{padding-top:env(safe-area-inset-top)}
}
@media (max-height:700px){
  #topbar{height:44px}
  #bar{min-height:64px;height:64px}
  .slot{width:46px;height:48px;font-size:9px}
  #sub p{font-size:14px;line-height:1.85}
  #btnHint,#btnSkip{height:40px;font-size:12px}
  .panel{padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  .panel h3{font-size:18px;margin-bottom:2px}
  .anotes img{width:60px}
  .noteone img{width:150px}
}
  @media (max-height:520px){
  #topbar{height:40px} #bar{height:64px} #sub p{font-size:12.5px;padding:6px 12px}
  .slot{width:46px;height:48px;font-size:9px}
}
#btnMenu{display:none}
@media (max-width:560px){
  .tb-right .iconbtn{display:none}
  #btnMenu{display:flex;width:44px;height:44px;font-size:20px;margin-left:2px}
}@media (max-width:560px){
  #modal{padding:0}
  .panel{width:100%;height:100%;max-height:none;border:0;border-radius:0;padding:20px 16px 24px}
  .tb-right .iconbtn{display:none}
  #btnMenu{display:flex;width:44px;height:44px;font-size:20px}
  .cast2{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .envs{grid-template-columns:repeat(2,1fr)}
  .kgrid{max-width:none}
  .k{height:56px;font-size:19px}
  .btn{min-height:50px;font-size:15px}
}
@media (orientation:portrait){
  #stage{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
  #sceneWrap{position:relative;inset:auto;width:100%;height:auto;aspect-ratio:3/2;flex:0 0 auto;overflow:hidden}
  svg.scene{position:absolute;inset:0;width:100%;height:100%}
  #sub{position:relative;bottom:auto;left:auto;right:auto;flex:1 1 auto;padding:16px 18px 10px;text-align:left}
  #sub p{display:block;max-width:none;margin:0;padding:0;background:transparent;border:0;
    font-size:15.5px;line-height:2.05;text-align:left;text-shadow:none}
  #action{bottom:96px;font-size:14px;padding:12px 22px}
}.intro-in .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-left">
      <div class="chapter" id="chapterLabel">序章 · <b>封条</b></div>
      <div id="goal">差事：清点遗物，填一份结案报告</div>
    </div>
    <div class="tb-right">
      <div id="strikes" aria-label="以为"><span></span><span></span><span></span></div>
      <span id="ver" style="font-size:10px;color:#5f5344;letter-spacing:.06em;margin-right:4px">v5.7</span><button class="iconbtn" id="btnMenu" aria-label="菜单">≡</button>
      <button class="iconbtn" id="btnCh2" aria-label="章节">章</button>
      <button class="iconbtn" id="btnCast" aria-label="人物">人</button>
      <button class="iconbtn" id="btnSound" aria-label="声音">♪</button>
      <button class="iconbtn" id="btnHelp" aria-label="提示">?</button>
    </div>
  </div>

  <div id="stage">
    <div id="sceneWrap">
      <!-- ========== 序章：戏楼大门 ========== -->
      <svg class="scene" id="s-gate" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var SAVE='yiwei.ch1.v1';

/* ============ 状态 ============ */
var skipBrief=false;
var S={scene:'gate',f:{},inv:[],strikes:0,muted:false,filter:false,started:false,maxCh:1};

var ITEMS={
  ticket:{n:'当票',ic:'票',d:'玉佩一枚，当三十块。票背有铅笔字：剩八。\n他娘给他的玉，换成了两张车票。'},
  hairpin:{n:'银簪',ic:'簪',d:'簪头一朵梅花。他说，梅花开在最冷的时候，那时候我们就熬过去了。\n她把簪子插在发髻上，对着镜子看了很久。'},
  blouse:{n:'蓝布衫',ic:'衣',d:'她唯一一件换洗的衣裳，洗得发白。\n她本来打算穿着它坐一夜火车。'},
  oil:{n:'桂花油',ic:'油',d:'她总在头发上抹一点。\n他把脸埋进那块绒布里闻过——甜的。'},
  bill:{n:'半张戏单',ic:'单',d:'残角印着：二楼·三号包厢。\n她留着它，是想记住谁坐在那上面。'},
  key:{n:'铜钥匙',ic:'钥',d:'从镜台暗格里摸出来的。\n她连自己的后路，都藏得这么小心。'},
  sleeve:{n:'水袖',ic:'袖',d:'白绸。戏班子的东西，不能带走。\n她把它叠好，放回了原处。'},
  string:{n:'断弦',ic:'弦',d:'月琴第一弦，最细的那根，弦头还沾着松香。\n他用它给她伴奏了三年，最后用它结果了自己。'},
  ticket2:{n:'两张车票',ic:'票',d:'三月初七，夜里十一点，南下。两张，找零八块。\n票背有铅笔字：梧桐。'}
};

/* ============ 存档 ============ */
function save(){
  try{localStorage.setItem(SAVE,JSON.stringify({f:S.f,inv:S.inv,strikes:S.strikes,scene:S.scene,maxCh:S.maxCh}))}catch(e){}
}
function readSave(){
  try{var r=localStorage.getItem(SAVE);return r?JSON.parse(r):null}catch(e){return null}
}

/* ============ 声音 ============ */
var ac=null,ambSrc=null,ambFilt=null,ambGain=null;
function audioInit(){
  if(ac)return;
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}
}
function pluck(freq,dur,vol){
  if(!ac||S.muted)return;
  try{
    var t=ac.currentTime,o=ac.createOscillator(),o2=ac.createOscillator(),
        g=ac.createGain(),g2=ac.createGain();
    o.type='triangle';o.frequency.value=freq;
    o2.type='sine';o2.frequency.value=freq*2.004;
    var d=dur||1.2,v=vol==null?0.12:vol;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v*0.25,t+0.008);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+d*0.45);
    o.connect(g);o2.connect(g2);g.connect(ac.destination);g2.connect(ac.destination);
    o.start(t);o2.start(t);o.stop(t+d+0.05);o2.stop(t+d+0.05);
  }catch(e){}
}
function tick(){
  if(!ac||S.muted)return;
  try{
    var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=920;
    g.gain.setValueAtTime(0.045,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.09);
  }catch(e){}
}
var bgmTimer=null,bgmChordTimer=null;
var bgmBus=null;
function amb(kind){
  if(!ac)return;
  try{
    if(!ambSrc){
      var len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
      ambSrc=ac.createBufferSource();ambSrc.buffer=buf;ambSrc.loop=true;
      ambFilt=ac.createBiquadFilter();ambGain=ac.createGain();ambGain.gain.value=0;
      ambSrc.connect(ambFilt);ambFilt.connect(ambGain);ambGain.connect(ac.destination);
      ambSrc.start();
    }
    if(S.muted){ambGain.gain.value=0;return}
    if(kind==='rain'){ambFilt.type='highpass';ambFilt.frequency.value=1600;ambGain.gain.value=0.030}
    else if(kind==='wind'){ambFilt.type='bandpass';ambFilt.frequency.value=620;ambFilt.Q.value=0.7;ambGain.gain.value=0.024}
    else if(kind==='cell'){ambFilt.type='lowpass';ambFilt.frequency.value=170;ambGain.gain.value=0.014}
    else if(kind==='room'){ambFilt.type='lowpass';ambFilt.frequency.value=280;ambGain.gain.value=0.017}
    else{ambGain.gain.value=0}
  }catch(e){}
}
function bgmStop(){
  if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null}
  if(bgmChordTimer){clearTimeout(bgmChordTimer);bgmChordTimer=null}
}
function bgmBusInit(){
  if(bgmBus||!ac)return;
  try{
    bgmBus=ac.createGain();bgmBus.gain.value=1;
    var dry=ac.createGain();dry.gain.value=0.72;
    var wet=ac.createGain();wet.gain.value=0.32;
    var len=Math.floor(ac.sampleRate*1.6),ir=ac.createBuffer(2,len,ac.sampleRate);
    for(var ch=0;ch<2;ch++){
      var d=ir.getChannelData(ch);
      for(var i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
    }
    var conv=ac.createConvolver();conv.buffer=ir;
    bgmBus.connect(dry);dry.connect(ac.destination);
    bgmBus.connect(conv);conv.connect(wet);wet.connect(ac.destination);
  }catch(e){bgmBus=null}
}
function bgmStart(){
  if(!ac||S.muted||bgmTimer)return;
  bgmBusInit();
  var chords=[
    [220.0,261.6,329.6],
    [174.6,220.0,261.6],
    [196.0,261.6,329.6],
    [196.0,246.9,293.7]
  ];
  var mel=[220.0,261.6,293.7,329.6,392.0,440.0,523.3];
  var ci=0;
  var tone=function(f,t,att,dur,vol,type){
    if(!ac)return;
    try{
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+att);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(bgmBus||ac.destination);
      o.start(t);o.stop(t+dur+0.12);
    }catch(e){}
  };
  var chord=function(){
    if(!ac||S.muted){bgmChordTimer=null;return}
    var c=chords[ci%chords.length];ci++;
    var t=ac.currentTime;
    tone(c[0]*0.5,t,0.5,5.4,0.020,'triangle');
    for(var i=0;i<c.length;i++)tone(c[i],t+i*0.04,0.7,4.8,0.017,'triangle');
    for(var k=0;k<3;k++)tone(c[k%c.length]*2,t+0.7+k*0.55,0.35,2.4,0.011,'sine');
    bgmChordTimer=setTimeout(chord,4400);
  };
  var play=function(){
    if(!ac||S.muted){bgmTimer=null;return}
    var f=mel[Math.floor(Math.random()*mel.length)];
    var t=ac.currentTime;
    tone(f,t,0.25,3.2,0.045,'sine');
    if(Math.random()<0.35)tone(f*1.5,t+0.22,0.3,2.6,0.018,'sine');
    bgmTimer=setTimeout(play,1500+Math.random()*1300);
  };
  chord();
  setTimeout(play,900);
}/* ============ 字幕 ============ */

function runSay(){
  pumping=true;

    if(g!==gen){pumping=false;return}
    if(!q.length){pumping=false;return}
    var text=q.shift();
    var box=$('#sub');
    box.classList.remove('wait');

      else{waiting=step;var b2=$('#sub');if(b2)b2.classList.add('wait')}
    };

  };
  step();
}

function upNode(el,sel){
  while(el&&el.nodeType===1){
    if(el.matches){if(el.matches(sel))return el}
    else if(el.msMatchesSelector&&el.msMatchesSelector(sel)){return el}
    el=el.parentNode;
  }
  return null;
}
var tipEl=null;
document.addEventListener('mousemove',function(e){
  if(!tipEl){tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl)}
  var g=upNode(e.target,'.hot');
  if(g&&g.getAttribute('aria-label')){
    tipEl.textContent=g.getAttribute('aria-label');
    tipEl.style.left=(e.clientX+14)+'px';tipEl.style.top=(e.clientY+14)+'px';
    tipEl.classList.add('on');
  }else{tipEl.classList.remove('on')}
});
document.addEventListener('click',function(e){
  if(waiting){var f=waiting;waiting=null;var sb=$('#sub');if(sb)sb.classList.remove('wait');f();}
  var m=upNode(e.target,'#modal');
  if(m){
    var c=upNode(e.target,'[data-cmd]');
    if(c&&c.getAttribute('data-cmd')==='close'){closeM();return}
  }
  var g=upNode(e.target,'.hot');
  if(!g){
    var st=document.getElementById('stage');
    if(st&&st.contains(e.target)){
      var best=null,bd=1e9,hs=document.querySelectorAll('svg.scene:not([hidden]) .hot');
      for(var i=0;i<hs.length;i++){
        var r=hs[i].getBoundingClientRect();
        if(r.width<2)continue;
        var dx=Math.max(r.left-e.clientX,0,e.clientX-r.right);
        var dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);
        var d=Math.sqrt(dx*dx+dy*dy);
        if(d<bd){bd=d;best=hs[i]}
      }
      if(best&&bd<30)g=best;
    }
  }
  if(!g)return;
  tick();
  var act=g.getAttribute('data-act');
  if(act){try{doAct(act,g)}catch(err){toast('这一步出错了：'+err.message)}}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var g=upNode(document.activeElement,'.hot');
  if(g){e.preventDefault();var a=g.getAttribute('data-act');if(a)doAct(a,g)}
});

    pc('yan','阿　宴','琴师，弹月琴。同夜，在后院槐树上自缢。')+

var LETTERS=[
 {d:'民国十七年 · 冬',who:'绍芸吾妹',t:'绸缎庄进了一匹水红。\n我在门口站了一会儿，没进去。\n你穿那个颜色最好看。这句话我没来得及说。'},
 {d:'民国十八年 · 春',who:'绍芸吾妹',t:'院里的海棠开了。\n去年开的时候你还在，站在树底下让我给你摘一朵。我说高，够不着。你说那就搬梯子。\n梯子还在。我没搬。\n花开了又落，落了又开。这院子一年比一年静。'},
 {d:'民国十九年 · 秋',who:'绍芸吾妹',t:'你的戏服我收在樟木箱里，不招虫。\n每年入秋拿出来看一次，看完再叠回去。叠法是你教我的：先对折，把袖子收进去，不然会起褶子。\n我手笨，学了三年，还是叠不好。\n你以前总笑我，说当兵的连件衣裳都叠不整齐。\n我现在叠得整齐了。\n你回来看看。'},
 {d:'民国二十年 · 冬',who:'绍芸吾妹',t:'娘走了。\n走之前她拉着我的手，问：绍芸呢。\n我说她在楼上。\n娘点点头，就闭了眼。\n我骗了她。\n我这辈子只骗过这一次。'},
 {d:'民国二十四年 · 三月',who:'绍芸吾妹',t:'今天有人在楼下唱了一句"海岛冰轮初转腾"。\n我在楼上听见，站起来了。\n站起来才想起，那不是你唱的。\n那姑娘的身段像你，甩水袖的弧度也像。\n可她不是你。\n我坐下的时候，腿是抖的。\n十年了，我还是听不得这一句。'},
 {d:'民国二十四年 · 十二月',who:'月棠吾爱',t:'你唱"转腾"的时候会抖一下。嗓子到那儿有个坎。\n别人听不出来。我听出来了。\n我坐在二楼，隔着栏杆，等你把这句唱完，才敢喘气。\n我不知道自己是在听她唱，还是在听你唱。\n分不清了。'},
 {d:'民国二十五年 · 正月',who:'月棠吾爱',t:'今天散戏，你和那个弹月琴的隔着一尺走。\n一尺。我看得很准。\n他不敢碰你，你也不敢碰他，两个人就这么并排走着，影子贴在一起。\n我看见了。\n我羡慕他。这话说出来不像人话，可我羡慕他。'},
 {d:'民国二十五年 · 二月',who:'月棠吾爱',t:'我包了你三个月的场。\n别打听为什么。\n你只管唱，唱完就走。\n我不会到后台去。\n我怕我去了，就说不清自己是来听戏的，还是来讨债的。'},
 {d:'民国二十六年 · 三月初一',who:'月棠吾爱',t:'我想过把你留下。\n想过给你三千兵、三个县，让你穿最好的料子，走到哪儿都有人给你让路。\n也想过把你关起来。这个念头我压了三个月，每天都压。\n可我这双手洗不干净。\n你在我身边，早晚要沾上。\n我妹妹就是这么沾上的。'},
 {d:'民国二十六年 · 三月初六',who:'月棠吾爱',t:'这人世欠我妹妹的，我还不上了。\n所以我拿你还。\n对你好，是想让她也被人这样对待一次；替你挡的那些事，本该挡在她前头。\n这不公平。我知道。\n你不用谢我，也不必记住我。\n明天夜里十一点，南下的车。\n你要活得好好的。你们都要活得好好的。'}
];

function actBox(){
  if(!S.f.uniform){say('信盒锁着。铜锁，钥匙孔很小。');toast('先看看屋里还有什么。');return}
  if(!S.f.boxOpen){

    setHidden(document.getElementById('blood3'),false);
    pluck(330,1.8,0.12);
    say('钥匙插进去，转了一圈。');
    say('盒子里全是信。一封一封，摞得整整齐齐。');
  }
  if(readCount()>=3&&!S.f.split){doSplit();return}

function openLetters(){
  var g='';
  for(var i=0;i<LETTERS.length;i++){
    g+='<div class="env'+(S.f['l'+i]?' read':'')+'" data-i="'+i+'">'+
       '<div class="ed">'+LETTERS[i].d+'</div><div class="es">'+(S.f['l'+i]?'已读':'未拆')+'</div></div>';
  }
  openM('<h3>信盒</h3><p class="muted">三千多封。十年的日子，都在这里面。<br>随手抽一封吧。</p>'+
    '<div class="envs">'+g+'</div>'+
    '<p class="muted" id="rc" style="margin:14px 0 0">已读 '+readCount()+' / '+LETTERS.length+'</p>'+
    '<div class="row" id="splitRow"></div>'+
    '<div class="row"><button class="btn ghost" data-cmd="close">合 上 盒 子</button></div>');
  $$('#modal .env').forEach(function(e){e.onclick=function(){showLetter(+e.getAttribute('data-i'))}});
  if(readCount()>=3)addSplit();
}
function showLetter(i){
  var L=LETTERS[i];
  S.f['l'+i]=1;save();
  pluck(392,1,0.08);
  var body=L.t.replace(/\n/g,'<br>');
  openM('<h3>'+L.d+'</h3><p class="muted">信封上有字，一笔一画，力透纸背。</p>'+
    '<div class="paper"><div class="addr">'+L.who+'：</div><p style="margin:0">'+body+'</p>'+
    '<div class="seal">绍棠<br>手书</div></div>'+
    '<div class="row"><button class="btn" id="back">放 回 去</button><button class="btn ghost" id="nextL">再 抽 一 封</button></div>');
  $('#back').onclick=function(){closeM();openLetters()};
  $('#nextL').onclick=function(){closeM();openLetters()};
  var n=readCount();
  if(n===3)say('三封。收信人换了，可字还是那个字。');
  if(n===6)say('他知道自己在做什么。他写下来了。');
}

  var row=$('#splitRow');if(!row)return;

  $('#split').onclick=function(){closeM();doSplit()};
}

  if(!(S.f.ydoor&&S.f.ytree&&S.f.robe4))return;

}
function actYdoor(){
  if(S.f.truth4q&&!S.f.truth4done){return truth4()}
  if(!S.f.ydoor){
    S.f.ydoor=true;save();refresh();
    say('后门是从里面被撬开的，木屑全朝里，撬棍还扔在门槛边上。');
    say('可你蹲下去看锁——锁眼是好的，是从外面锁死的。有人先把它锁上，再让里面的人自己撬。');
  }else if(!S.f.ygap){
    S.f.ygap=true;save();refresh();

  }else{
    say('门框内侧留着十道指印，朝下。她推过，撞过，抓过，这扇门一直没有开。');

    S.f.ystring=true;save();refresh();
